<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FacultyMind — Shell Preview</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/shell.css">
  <script>
    // Read theme from localStorage BEFORE render to prevent flash
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
</head>
<body>

  <!-- Titlebar -->
  <div class="titlebar">
    <div class="titlebar-left">
      <div class="titlebar-logo">FM</div>
      <span class="titlebar-text">FacultyMind</span>
    </div>
    <div class="titlebar-drag"></div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" title="Minimize">&#8211;</button>
      <button class="titlebar-btn" title="Maximize">&#9633;</button>
      <button class="titlebar-btn close" title="Close">&#10005;</button>
    </div>
  </div>

  <!-- App Layout -->
  <div class="app-layout">

    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-mark">FM</div>
        <span class="sidebar-logo-text">FacultyMind</span>
      </div>

      <ul class="sidebar-nav">
        <li class="nav-item active" data-view="chat">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/></svg></span>
          <span class="nav-label">DASH AI</span>
        </li>
        <li class="nav-item" data-view="schedule">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg></span>
          <span class="nav-label">Schedule</span>
        </li>
        <li class="nav-item" data-view="shadsync">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg></span>
          <span class="nav-label">ShadSync OBE</span>
        </li>
        <li class="nav-item" data-view="blooms">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg></span>
          <span class="nav-label">Bloom's Engine</span>
        </li>
        <li class="nav-item" data-view="email">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></span>
          <span class="nav-label">Email Intel</span>
        </li>
        <li class="nav-item" data-view="vault">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <span class="nav-label">Local Vault</span>
        </li>
        <li class="nav-item" data-view="portal">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></span>
          <span class="nav-label">Quick Portal</span>
        </li>
        <li class="nav-item" data-view="diu-portal">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M2 22V6l9-4 9 4v16"/><path d="M6 10v8"/><path d="M10 10v8"/><path d="M14 10v8"/><path d="M18 10v8"/><path d="M2 10h18"/></svg></span>
          <span class="nav-label">DIU Teachers Portal</span>
        </li>
      </ul>

      <div class="sidebar-bottom">
        <button class="theme-toggle" id="theme-toggle">
          <svg id="theme-icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg id="theme-icon-sun" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <span>Toggle Theme</span>
        </button>
        <button class="nav-item" data-view="settings">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span>
          <span class="nav-label">Settings</span>
        </button>
        <div class="sidebar-avatar">S</div>
      </div>
    </nav>

    <!-- Content Area (placeholder) -->
    <main class="content-area">
      <div style="padding:var(--space-8); color:var(--text-secondary); font-size:var(--font-lg);">
        Content area — screens render here
      </div>
    </main>

  </div>

  <script>
    // Theme toggle logic
    const toggle = document.getElementById('theme-toggle');
    const moonIcon = document.getElementById('theme-icon-moon');
    const sunIcon = document.getElementById('theme-icon-sun');

    function updateIcons() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      moonIcon.style.display = isLight ? 'none' : 'block';
      sunIcon.style.display = isLight ? 'block' : 'none';
    }
    updateIcons();

    toggle.addEventListener('click', () => {
      const html = document.documentElement;
      html.classList.add('theme-transitioning');
      const isLight = html.getAttribute('data-theme') === 'light';
      if (isLight) {
        html.removeAttribute('data-theme');
        localStorage.setItem('theme', 'dark');
      } else {
        html.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
      }
      updateIcons();
      setTimeout(() => html.classList.remove('theme-transitioning'), 300);
    });

    // Nav item click
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
      });
    });
  </script>
</body>
</html>
